<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — InvoChat AI</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><img src="logo.svg" alt=""><span>InvoChat AI</span></div>
    <a class="nav-link" data-page="dashboard.html" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Dashboard</a>
    <a class="nav-link" data-page="invoice.html" href="invoice.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6M9 8h6M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg> New Invoice</a>
    <a class="nav-link active" data-page="customers.html" href="customers.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm11 8v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Customers</a>
    <a class="nav-link" data-page="records.html" href="records.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3V3zm0 6h18M3 15h18M9 3v18"/></svg> Records</a>
    <a class="nav-link" data-page="profile.html" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></svg> Profile</a>
    <a class="nav-link" data-page="settings.html" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg> Settings</a>
    <div class="sidebar-footer"><a class="nav-link" href="#" data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Log out</a></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="flex items-center gap-12">
        <button class="menu-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div class="topbar-title">Customers</div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" id="btn-add-customer">+ Add Customer</button>
        <div class="avatar" data-user-avatar>?</div>
      </div>
    </div>

    <div class="content">
      <!-- LIST VIEW -->
      <div id="list-view">
        <div class="card mb-16">
          <input class="input" id="customer-search" placeholder="Search customers by name or phone…">
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Customer</th><th>Phone</th><th>Invoices</th><th>Total Spent</th><th>Balance</th></tr></thead>
              <tbody id="customers-tbody"></tbody>
            </table>
          </div>
          <div id="customers-empty" style="display:none;"></div>
        </div>
      </div>

      <!-- PROFILE VIEW -->
      <div id="profile-view" style="display:none;">
        <button class="btn btn-ghost btn-sm mb-16" id="back-to-list">← Back to customers</button>
        <div class="grid-2">
          <div class="flex flex-col gap-16">
            <div class="card flex items-center gap-16">
              <div class="avatar" style="width:56px;height:56px;font-size:19px;" id="cp-avatar"></div>
              <div>
                <div style="font-size:19px;font-weight:800;" id="cp-name"></div>
                <div class="text-muted text-sm" id="cp-phone"></div>
              </div>
              <div class="flex gap-8" style="margin-left:auto;">
                <a class="btn-icon" id="cp-call" title="Call"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></a>
                <a class="btn-icon" id="cp-whatsapp" title="WhatsApp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></a>
                <button class="btn-icon" id="cp-edit" title="Edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
              </div>
            </div>

            <div class="card">
              <div class="section-title">Invoice history</div>
              <div id="cp-invoices"></div>
            </div>
          </div>

          <div class="flex flex-col gap-16">
            <div class="card">
              <div class="section-title">Statistics</div>
              <div class="flex flex-col gap-8 text-sm" id="cp-stats"></div>
            </div>
            <div class="card">
              <div class="section-title">Record a payment</div>
              <form id="record-payment-form">
                <div class="field"><label>Amount</label><input class="input" name="amount" type="number" min="1" step="0.01" required></div>
                <div class="field"><label>Method</label>
                  <select class="input" name="method"><option>Cash</option><option>Bank Transfer</option><option>POS</option><option>Other</option></select>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Record Payment</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit customer modal -->
<div class="modal-overlay" id="modal-customer">
  <div class="modal">
    <div class="modal-header"><h3 id="customer-modal-title">Add Customer</h3><button class="btn-icon" data-close-modal="modal-customer">✕</button></div>
    <form id="customer-form">
      <input type="hidden" name="id">
      <div class="field"><label>Customer name</label><input class="input" name="name" required></div>
      <div class="field"><label>Phone number</label><input class="input" name="phone" type="tel" required></div>
      <button type="submit" class="btn btn-primary btn-block">Save</button>
    </form>
  </div>
</div>

<a href="invoice.html" class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></a>

<script type="module" src="customers.js"></script>
</body>
</html>
