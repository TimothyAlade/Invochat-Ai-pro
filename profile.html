<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — InvoChat AI</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><img src="logo.svg" alt=""><span>InvoChat AI</span></div>
    <a class="nav-link" data-page="dashboard.html" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Dashboard</a>
    <a class="nav-link" data-page="invoice.html" href="invoice.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6M9 8h6M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg> New Invoice</a>
    <a class="nav-link" data-page="customers.html" href="customers.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm11 8v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Customers</a>
    <a class="nav-link" data-page="records.html" href="records.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3V3zm0 6h18M3 15h18M9 3v18"/></svg> Records</a>
    <a class="nav-link active" data-page="profile.html" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></svg> Profile</a>
    <a class="nav-link" data-page="settings.html" href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg> Settings</a>
    <div class="sidebar-footer"><a class="nav-link" href="#" data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Log out</a></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="flex items-center gap-12">
        <button class="menu-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div class="topbar-title">Profile</div>
      </div>
      <div class="topbar-actions"><div class="avatar" data-user-avatar>?</div></div>
    </div>

    <div class="content">
      <div class="grid-2">
        <div class="card">
          <div class="flex items-center gap-16 mb-16">
            <div class="avatar" style="width:64px;height:64px;font-size:22px;" data-user-avatar>?</div>
            <div>
              <div style="font-size:19px;font-weight:800;" data-user-name>—</div>
              <div class="text-muted text-sm" data-business-name>—</div>
            </div>
            <button class="btn btn-secondary btn-sm" style="margin-left:auto;" id="btn-edit-profile">Edit</button>
          </div>
          <div class="divider"></div>
          <div class="flex flex-col gap-12 text-sm">
            <div class="flex justify-between"><span class="text-muted">Email</span><span class="font-bold" id="p-email">—</span></div>
            <div class="flex justify-between"><span class="text-muted">Phone</span><span class="font-bold" id="p-phone">—</span></div>
            <div class="flex justify-between"><span class="text-muted">Address</span><span class="font-bold" id="p-address">—</span></div>
            <div class="flex justify-between"><span class="text-muted">Account created</span><span class="font-bold" id="p-created">—</span></div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">Lifetime statistics</div>
          <div class="flex flex-col gap-12 text-sm" id="p-stats"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-edit-profile">
  <div class="modal">
    <div class="modal-header"><h3>Edit Profile</h3><button class="btn-icon" data-close-modal="modal-edit-profile">✕</button></div>
    <form id="edit-profile-form">
      <div class="field"><label>Owner name</label><input class="input" name="ownerName" required></div>
      <div class="field"><label>Business name</label><input class="input" name="businessName" required></div>
      <div class="field"><label>Phone</label><input class="input" name="phone" type="tel" required></div>
      <div class="field"><label>Address</label><input class="input" name="address"></div>
      <button type="submit" class="btn btn-primary btn-block">Save changes</button>
    </form>
  </div>
</div>

<script type="module" src="profile.js"></script>
</body>
</html>
