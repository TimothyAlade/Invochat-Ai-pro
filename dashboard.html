<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — InvoChat AI</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand"><img src="logo.svg" alt=""><span>InvoChat AI</span></div>
    <a class="nav-link active" data-page="dashboard.html" href="dashboard.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Dashboard
    </a>
    <a class="nav-link" data-page="invoice.html" href="invoice.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12h6m-6 4h6M9 8h6M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/></svg> New Invoice
    </a>
    <a class="nav-link" data-page="customers.html" href="customers.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm11 8v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> Customers
    </a>
    <a class="nav-link" data-page="records.html" href="records.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3V3zm0 6h18M3 15h18M9 3v18"/></svg> Records
    </a>
    <a class="nav-link" data-page="profile.html" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v1"/></svg> Profile
    </a>
    <a class="nav-link" data-page="settings.html" href="settings.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg> Settings
    </a>
    <div class="sidebar-footer">
      <a class="nav-link" href="#" data-logout>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Log out
      </a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="flex items-center gap-12">
        <button class="menu-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div>
          <div class="topbar-title" id="greeting">Welcome</div>
          <div class="topbar-sub" id="today-date"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" data-theme-toggle title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.7-.7M6.34 6.34l-.7-.7m12.02 0l-.7.7M6.34 17.66l-.7.7M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        </button>
        <div style="position:relative;">
          <button class="btn-icon" id="bell-btn" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <span id="notif-dot" style="display:none;position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--color-danger);border-radius:50%;"></span>
        </div>
        <div class="avatar" data-user-avatar>?</div>
      </div>
    </div>

    <div class="content">
      <div class="kpi-grid mb-16" id="kpi-grid">
        <div class="card kpi-card"><div class="skeleton" style="height:70px;"></div></div>
        <div class="card kpi-card"><div class="skeleton" style="height:70px;"></div></div>
        <div class="card kpi-card"><div class="skeleton" style="height:70px;"></div></div>
        <div class="card kpi-card"><div class="skeleton" style="height:70px;"></div></div>
      </div>

      <div class="grid-2">
        <div class="flex flex-col gap-16">
          <div class="card">
            <div class="flex justify-between items-center mb-16">
              <div class="section-title" style="margin-bottom:0;">Weekly revenue</div>
            </div>
            <canvas id="revenue-chart" height="140"></canvas>
          </div>

          <div class="card">
            <div class="section-title">Recent activity</div>
            <div id="recent-activity"></div>
          </div>
        </div>

        <div class="flex flex-col gap-16">
          <div class="card">
            <div class="section-title">Quick actions</div>
            <div class="flex flex-col gap-8">
              <a href="invoice.html" class="btn btn-primary btn-block">+ New Invoice</a>
              <button class="btn btn-secondary btn-block" data-open-add-customer>+ Add Customer</button>
              <a href="customers.html" class="btn btn-secondary btn-block">Record Payment</a>
              <a href="receipt.html" class="btn btn-secondary btn-block">Generate Receipt</a>
            </div>
          </div>

          <div class="card">
            <div class="section-title">Customers owing</div>
            <div id="customers-owing"></div>
          </div>

          <div class="card">
            <div class="section-title">Business insights</div>
            <div id="business-insights" class="flex flex-col gap-8 text-sm"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<a href="invoice.html" class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></a>

<!-- Quick add customer modal -->
<div class="modal-overlay" id="modal-add-customer">
  <div class="modal">
    <div class="modal-header"><h3>Add Customer</h3><button class="btn-icon" data-close-modal="modal-add-customer">✕</button></div>
    <form id="quick-customer-form">
      <div class="field"><label>Customer name</label><input class="input" name="name" required></div>
      <div class="field"><label>Phone number</label><input class="input" name="phone" type="tel" required></div>
      <button type="submit" class="btn btn-primary btn-block">Save customer</button>
    </form>
  </div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
